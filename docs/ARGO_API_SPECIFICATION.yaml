components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token 인증. Header에 `Authorization: Bearer <token>` 형식으로 전달

  parameters:
    artist_id:
      name: artist_id
      in: path
      required: true
      description: 작가 ID
      schema:
        type: string
        example: artist_001
    inst_id:
      name: inst_id
      in: path
      required: true
      description: 기관 ID
      schema:
        type: string
        example: inst_001
    exh_id:
      name: exh_id
      in: path
      required: true
      description: 전시 ID
      schema:
        type: string
        example: exh_001
    trans_id:
      name: trans_id
      in: path
      required: true
      description: 거래 ID
      schema:
        type: string
        example: trans_001
    cluster_id:
      name: cluster_id
      in: path
      required: true
      description: 군집 ID
      schema:
        type: string
        example: cluster_001
    skip:
      name: skip
      in: query
      description: 건너뛸 레코드 수
      schema:
        type: integer
        default: 0
        minimum: 0
    limit:
      name: limit
      in: query
      description: 페이지당 항목 수
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:
    Artist:
      type: object
      description: 작가 엔터티 (JSON-LD 형식, Schema.org Person 타입)
      properties:
        '@context':
          type: string
          example: https://schema.org/
        '@type':
          type: string
          example: Person
        '@id':
          type: string
          example: argo://artist/artist_001
        identifier:
          type: object
          properties:
            '@type':
              type: string
              example: PropertyValue
            propertyID:
              type: string
              example: ARGO
            value:
              type: string
              example: artist_001
        name:
          type: string
          example: 작가 A
        alternateName:
          type: string
          example: Artist A
        birthDate:
          type: string
          example: '1975'
        url:
          type: string
          format: uri
        address:
          type: object
          properties:
            '@type':
              type: string
              example: PostalAddress
            addressLocality:
              type: string
              example: Seoul
            addressCountry:
              type: string
              example: KR
        jobTitle:
          type: string
          example: Professor
        argo:scores:
          type: object
          properties:
            argo:inst_score:
              type: number
              format: float
              minimum: 0
              maximum: 100
            argo:acad_score:
              type: number
              format: float
              minimum: 0
              maximum: 100
            argo:media_score:
              type: number
              format: float
              minimum: 0
              maximum: 100
            argo:network_score:
              type: number
              format: float
              minimum: 0
              maximum: 100
            argo:composite_score:
              type: number
              format: float
              minimum: 0
              maximum: 100
            argo:composite_confidence:
              type: number
              format: float
              minimum: 0
              maximum: 1
        argo:structuralist_analysis:
          $ref: '#/components/schemas/StructuralistAnalysis'
        argo:coordinates_3d:
          type: object
          properties:
            argo:x:
              type: number
              format: float
            argo:y:
              type: number
              format: float
            argo:z:
              type: number
              format: float
            argo:radius:
              type: number
              format: float
        argo:cluster:
          type: object
          properties:
            '@type':
              type: string
              example: argo:Cluster
            '@id':
              type: string
              example: argo://cluster/cluster_001

    Institution:
      type: object
      description: 기관 엔터티 (JSON-LD 형식, Schema.org Organization 타입)
      properties:
        '@context':
          type: string
          example: https://schema.org/
        '@type':
          type: string
          example: Organization
        '@id':
          type: string
          example: argo://institution/inst_001
        name:
          type: string
          example: 국립현대미술관
        url:
          type: string
          format: uri
        address:
          type: object
          properties:
            '@type':
              type: string
              example: PostalAddress
            addressLocality:
              type: string
              example: Seoul
            addressCountry:
              type: string
              example: KR

    Exhibition:
      type: object
      description: 전시 엔터티 (JSON-LD 형식, Schema.org Event 타입)
      properties:
        '@context':
          type: string
          example: https://schema.org/
        '@type':
          type: string
          example: Event
        '@id':
          type: string
          example: argo://exhibition/exh_001
        name:
          type: string
          example: 한국 추상미술의 맥락
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        location:
          type: object
          properties:
            '@type':
              type: string
              example: Place
            name:
              type: string

    Transaction:
      type: object
      description: 거래 엔터티
      properties:
        trans_id:
          type: string
          example: trans_001
        artist_id:
          type: string
        artwork_id:
          type: string
        price_krw:
          type: integer
        transaction_date:
          type: string
          format: date
        transaction_type:
          type: string
        venue:
          type: string
        market_analysis:
          type: object
          properties:
            anomaly_score:
              type: number
              format: float
            is_outlier:
              type: boolean

    Cluster:
      type: object
      description: 군집 엔터티
      properties:
        cluster_id:
          type: string
          example: cluster_001
        cluster_type:
          type: string
          enum: [louvain, geographic, genre]
        name:
          type: string
        member_count:
          type: integer
        cohesion_score:
          type: number
          format: float

    Artwork:
      type: object
      description: 작품 엔터티
      properties:
        work_id:
          type: string
        title:
          type: string
        creation_year:
          type: integer
        medium:
          type: string
        dimensions:
          type: object
          properties:
            height_cm:
              type: number
            width_cm:
              type: number
        estimated_value_usd:
          type: integer

    StructuralistAnalysis:
      type: object
      description: 구조주의 분석 결과
      properties:
        dominant_capital:
          type: string
          enum: [institutional, academic, media, network]
        capital_composition:
          type: object
          properties:
            institutional_ratio:
              type: number
              format: float
            academic_ratio:
              type: number
              format: float
            media_ratio:
              type: number
              format: float
            network_ratio:
              type: number
              format: float
        structural_position:
          type: object
          properties:
            field_quadrant:
              type: string
              enum: [Q1_established, Q2_academic_elite, Q3_media_star, Q4_emerging]
            position_stability:
              type: number
              format: float
            mobility_potential:
              type: number
              format: float

    NetworkGraph:
      type: object
      description: 네트워크 그래프 구조
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              score:
                type: number
                format: float
              type:
                type: string
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              strength:
                type: number
                format: float
              type:
                type: string

    GalaxySnapshot:
      type: object
      description: 갤럭시 스냅샷
      properties:
        snapshot_id:
          type: string
        snapshot_date:
          type: string
          format: date-time
        galaxy_statistics:
          type: object
          properties:
            total_artists:
              type: integer
            total_institutions:
              type: integer
            total_exhibitions:
              type: integer
            total_artworks:
              type: integer
            total_transactions:
              type: integer
            total_clusters:
              type: integer
        structure_metrics:
          type: object
          properties:
            entropy:
              type: number
              format: float
            density:
              type: number
              format: float
            clustering_coefficient:
              type: number
              format: float
            average_path_length:
              type: number
              format: float
            diameter:
              type: integer

    Hypothesis:
      type: object
      description: LLM 생성 가설 (Gemini 3 Pro Preview)
      properties:
        title:
          type: string
          description: 가설 제목 (20자 이내)
          example: 후원자의 재정 유동성
        description:
          type: string
          description: 가설 설명 (50자 이내)
          example: 수집가가 긴급 자금 조달을 위해 고가로 낙찰
        confidence:
          type: number
          format: float
          description: 신뢰도 (0~100%)
          minimum: 0
          maximum: 100
          example: 45
        reasoning:
          type: string
          description: 가설 근거
          example: 시장 예상치의 +65%는 일반적인 수준 초과. 경매 열정과 후원자의 목적-구입 패턴

    Anomaly:
      type: object
      description: 이상치 거래 정보 (Gemini 3 Pro Preview로 가설 생성)
      properties:
        transaction_id:
          type: string
        artist_id:
          type: string
        artist_name:
          type: string
        artwork_title:
          type: string
        price_krw:
          type: integer
        estimate_high_krw:
          type: integer
        deviation_percent:
          type: number
          format: float
        anomaly_score:
          type: number
          format: float
          description: 이상치 점수 (0.7 이상 = 이상치)
        anomaly_type:
          type: string
          enum: [overvalued, undervalued, timing_anomaly]
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/Hypothesis'
          description: Gemini 3 Pro Preview로 생성된 가설 목록
        computation_time_ms:
          type: integer

    Error:
      type: object
      description: 에러 응답 스키마
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INVALID_PARAMETER
            message:
              type: string
              example: 사용자 친화적 에러 메시지
            details:
              type: string
              example: 상세 기술 정보 (개발자용)
            timestamp:
              type: string
              format: date-time
            request_id:
              type: string
            documentation:
              type: string
              format: uri

  responses:
    400BadRequest:
      description: 잘못된 요청
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
          description: 레이트 제한 (요청 수)
        x-ratelimit-remaining:
          schema:
            type: integer
          description: 남은 요청 수
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_PARAMETER
              message: 필수 파라미터가 누락되었거나 형식이 올바르지 않습니다
              details: 'limit' 파라미터는 1 이상 100 이하여야 합니다
              timestamp: '2025-12-08T18:30:00Z'
              request_id: req_123456789
              documentation: https://artdrive1208-api-xxx.run.app/docs/errors/INVALID_PARAMETER

    401Unauthorized:
      description: 인증 실패
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: API 키가 없거나 만료되었습니다
              details: Authorization 헤더에 유효한 JWT 토큰이 필요합니다
              timestamp: '2025-12-08T18:30:00Z'
              request_id: req_123456789
              documentation: https://artdrive1208-api-xxx.run.app/docs/errors/UNAUTHORIZED

    403Forbidden:
      description: 권한 없음
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 이 리소스에 대한 접근 권한이 없습니다
              details: 프리미엄 계층 이상의 구독이 필요합니다
              timestamp: '2025-12-08T18:30:00Z'
              request_id: req_123456789
              documentation: https://artdrive1208-api-xxx.run.app/docs/errors/FORBIDDEN

    404NotFound:
      description: 리소스를 찾을 수 없음
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: 요청한 작가를 찾을 수 없습니다
              details: artist_id 'artist_999'에 해당하는 작가가 존재하지 않습니다
              timestamp: '2025-12-08T18:30:00Z'
              request_id: req_123456789
              documentation: https://artdrive1208-api-xxx.run.app/docs/errors/NOT_FOUND

    429TooManyRequests:
      description: 레이트 제한 초과
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
            example: 10000
          description: 레이트 제한 (요청 수)
        x-ratelimit-remaining:
          schema:
            type: integer
            example: 0
          description: 남은 요청 수
        retry-after:
          schema:
            type: integer
            example: 3600
          description: 재시도 가능 시간 (초)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: 요청 한도를 초과했습니다
              details: 월간 요청 한도(10,000건)를 초과했습니다. 다음 리셋 시간까지 대기하거나 프리미엄 계층으로 업그레이드하세요
              timestamp: '2025-12-08T18:30:00Z'
              request_id: req_123456789
              documentation: https://artdrive1208-api-xxx.run.app/docs/errors/RATE_LIMIT_EXCEEDED

    500InternalError:
      description: 내부 서버 오류
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: 서버에서 오류가 발생했습니다
              details: Neo4j 쿼리 실행 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요
              timestamp: '2025-12-08T18:30:00Z'
              request_id: req_123456789
              documentation: https://artdrive1208-api-xxx.run.app/docs/errors/INTERNAL_ERROR

    503ServiceUnavailable:
      description: 서비스 일시 중단
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: 서비스가 일시적으로 사용할 수 없습니다
              details: Gemini API 서비스가 일시적으로 중단되었습니다. 잠시 후 다시 시도해주세요
              timestamp: '2025-12-08T18:30:00Z'
              request_id: req_123456789
              documentation: https://artdrive1208-api-xxx.run.app/docs/errors/SERVICE_UNAVAILABLE

