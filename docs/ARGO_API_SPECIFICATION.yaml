      summary: 이상치 목록 조회
      description: |
        이상치 거래 목록 조회. 
        각 이상치에 대해 Gemini 3 Pro Preview 모델을 사용하여 가설을 생성합니다.
        환경변수 `GEMINI_API_KEY`가 필요합니다 (로컬 `.env` 파일에서 주입).
      tags:
        - Anomalies
