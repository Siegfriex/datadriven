        - name: segment_id
          in: query
          description: 세그먼트 ID 필터
          schema:
            type: string
        - name: confidence
          in: query
          description: 신뢰도 임계값 (기본값: 0.8)
          schema:
            type: number
            format: float
            default: 0.8
            minimum: 0
            maximum: 1
        - name: limit
          in: query
          description: 반환할 이상치 수 제한
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 성공
          headers:
            x-ai-model:
              description: 사용된 AI 모델
              schema:
                type: string
                example: gemini-3-pro-preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  anomalies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Anomaly'
                  total_anomalies:
                    type: integer
              examples:
                with_hypotheses:
                  summary: Gemini 3 Pro Preview로 생성된 가설 포함 예제
                  value:
                    anomalies:
                      - transaction_id: trans_001
                        artist_id: artist_001
                        artist_name: 이상훈
                        artwork_title: 무제 (1990)
                        price_krw: 250000000
                        estimate_high_krw: 150000000
                        deviation_percent: 66.7
                        anomaly_score: 0.78
                        anomaly_type: overvalued
                        hypotheses:
                          - title: 후원자의 재정 유동성
                            description: 수집가가 긴급 자금 조달을 위해 고가로 낙찰
                            confidence: 36
                            reasoning: 시장 예상치의 +65%는 일반적인 수준 초과. 경매 열정과 후원자의 목적-구입 패턴
                          - title: 작가 명성 급상승
                            description: 최근 전시로 인한 작가 인지도 급증
                            confidence: 28
                            reasoning: 최근 국립현대미술관 전시 참여로 인한 시장 반응
                        computation_time_ms: 1250
                    total_anomalies: 1
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

