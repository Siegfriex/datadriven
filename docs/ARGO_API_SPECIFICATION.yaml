openapi: 3.0.3
info:
  title: ARGO API
  version: 1.0.0
  description: |
    ARGO (Art-world Real-time Galaxy Observatory) API 명세서
    
    한국 미술계 구조 분석 엔진의 RESTful API입니다.
    모든 응답은 JSON-LD 형식 (Schema.org 표준)을 따릅니다.
    
    **참조 문서:**
    - `ARGO_DATA_SOURCE_APIS.md`: 외부 데이터 소스 API 명세서 (데이터 수집용)
    - `ARGO_DATA_COLLECTION_METHODOLOGY.md`: 데이터 수집 방법론
    
    **AI 모델 정보:**
    - 이상치 탐지 가설 생성: Gemini 3 Pro Preview (`gemini-3-pro-preview`)
    - 환경변수: `GEMINI_API_KEY` (로컬 `.env` 파일에서 주입)
    
    **프로젝트 정보:**
    - 프로젝트 ID: artdrive1208
    - 리전: asia-northeast3 (서울)
    - 초기 도메인: https://artdrive1208-api-xxx.run.app/v1
    - 향후 커스텀 도메인: https://api.argo.art/v1
    
    **구분:**
    - 이 문서: ARGO 백엔드가 제공하는 API (프론트엔드-백엔드 간 API)
    - 데이터 소스 API: 외부에서 데이터를 수집하는 API (`ARGO_DATA_SOURCE_APIS.md` 참조)
  contact:
    name: ARGO Project Team
    email: support@argo.art
  license:
    name: Proprietary
    url: https://argo.art/license

servers:
  - url: https://artdrive1208-api-xxx.run.app/v1
    description: 초기 Cloud Run 도메인
  - url: https://api.argo.art/v1
    description: 향후 커스텀 도메인 (예정)

tags:
  - name: Artists
    description: 작가 관련 API
  - name: Institutions
    description: 기관 관련 API
  - name: Exhibitions
    description: 전시 관련 API
  - name: Transactions
    description: 거래 관련 API
  - name: Clusters
    description: 군집 관련 API
  - name: Analysis
    description: 분석 API (중심성, 커뮤니티 탐지 등)
  - name: Anomalies
    description: 이상치 탐지 API (Gemini 3 Pro Preview 사용)
  - name: Search
    description: 통합 검색 API
  - name: Galaxy
    description: 갤럭시 및 메타데이터 API

security:
  - BearerAuth: []

paths:
  /v1/api/artists:
    get:
      summary: 모든 작가 조회
      description: 페이지네이션 및 필터를 지원하는 작가 목록 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
        - name: segment_id
          in: query
          description: 세그먼트 ID 필터
          schema:
            type: string
        - name: career_stage
          in: query
          description: 경력 단계 필터
          schema:
            type: string
            enum: [early, mid, late, established]
        - name: min_score
          in: query
          description: 최소 복합 점수 필터
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 100
      responses:
        '200':
          description: 성공
          headers:
            x-ratelimit-limit:
              schema:
                type: integer
              description: 레이트 제한 (요청 수)
            x-ratelimit-remaining:
              schema:
                type: integer
              description: 남은 요청 수
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
                  total:
                    type: integer
                  page:
                    type: integer
              examples:
                paginated_response:
                  summary: 페이지네이션 응답 예제
                  value:
                    artists:
                      - '@context': https://schema.org/
                        '@type': Person
                        '@id': argo://artist/artist_001
                        name: 작가 A
                        argo:scores:
                          argo:composite_score: 74.15
                    total: 100
                    page: 1
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/{artist_id}:
    get:
      summary: 작가 상세 정보 조회
      description: 특정 작가의 상세 정보 및 모든 관계 데이터 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/artist_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  artist:
                    $ref: '#/components/schemas/Artist'
                  affiliated_institutions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Institution'
                  collaborators:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
                  exhibitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exhibition'
                  artworks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artwork'
                  cluster:
                    $ref: '#/components/schemas/Cluster'
              examples:
                jsonld:
                  summary: JSON-LD 형식 응답 예제
                  value:
                    artist:
                      '@context': https://schema.org/
                      '@type': Person
                      '@id': argo://artist/artist_001
                      identifier:
                        '@type': PropertyValue
                        propertyID: ARGO
                        value: artist_001
                      name: 작가 A
                      alternateName: Artist A
                      birthDate: '1975'
                      url: https://example.com/artist_a
                      address:
                        '@type': PostalAddress
                        addressLocality: Seoul
                        addressCountry: KR
                      jobTitle: Professor
                      argo:scores:
                        argo:inst_score: 82
                        argo:acad_score: 68
                        argo:media_score: 75
                        argo:network_score: 71
                        argo:composite_score: 74.15
                        argo:composite_confidence: 0.92
                      argo:structuralist_analysis:
                        dominant_capital: institutional
                        capital_composition:
                          institutional_ratio: 0.28
                          academic_ratio: 0.23
                          media_ratio: 0.25
                          network_ratio: 0.24
                        structural_position:
                          field_quadrant: Q1_established
                          position_stability: 0.85
                          mobility_potential: 0.15
                    affiliated_institutions:
                      - '@type': Organization
                        '@id': argo://institution/inst_001
                        name: 국립현대미술관
                    collaborators: []
                    exhibitions: []
                    artworks: []
                    cluster:
                      '@type': argo:Cluster
                      '@id': argo://cluster/cluster_001
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/{artist_id}/network:
    get:
      summary: 작가 네트워크 그래프 조회
      description: 작가의 1홉 또는 2홉 네트워크 그래프 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/artist_id'
        - name: depth
          in: query
          description: 네트워크 깊이 (1 또는 2)
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGraph'
              examples:
                network_graph:
                  summary: 네트워크 그래프 예제
                  value:
                    nodes:
                      - id: artist_001
                        name: 작가 A
                        score: 74.15
                        type: artist
                      - id: artist_002
                        name: 작가 B
                        score: 68.5
                        type: artist
                    edges:
                      - source: artist_001
                        target: artist_002
                        strength: 0.65
                        type: COLLABORATED_WITH
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/{artist_id}/exhibitions:
    get:
      summary: 작가 전시 목록 조회
      description: 특정 작가가 참여한 전시 목록 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/artist_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  exhibitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exhibition'
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/{artist_id}/artworks:
    get:
      summary: 작가 작품 목록 조회
      description: 특정 작가의 작품 목록 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/artist_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  artworks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artwork'
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/{artist_id}/structural-equivalents:
    get:
      summary: 구조적 등가성 작가 조회
      description: 구조적 등가성 임계값(0.15) 내의 작가 목록 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/artist_id'
        - name: limit
          in: query
          description: 반환할 작가 수 제한
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  equivalents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
                  equivalence_score:
                    type: number
                    format: float
                    description: 구조적 등가성 점수
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/{artist_id}/capital-composition:
    get:
      summary: 자본 구성 분석 조회
      description: 4가지 자본(제도, 학술, 담론, 네트워크) 구성 분석 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/artist_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  inst_score:
                    type: number
                    format: float
                  acad_score:
                    type: number
                    format: float
                  media_score:
                    type: number
                    format: float
                  network_score:
                    type: number
                    format: float
                  dominant_capital:
                    type: string
                    enum: [institutional, academic, media, network]
                  field_quadrant:
                    type: string
                    enum: [Q1_established, Q2_academic_elite, Q3_media_star, Q4_emerging]
                  structuralist_analysis:
                    $ref: '#/components/schemas/StructuralistAnalysis'
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/{artist_id}/market:
    get:
      summary: 작가 시장 정보 조회
      description: 작가의 거래 이력, 가격 추이, 시장 백분위수 조회
      tags:
        - Artists
      parameters:
        - $ref: '#/components/parameters/artist_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  price_trend:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: number
                  market_percentile:
                    type: number
                    format: float
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/artists/search:
    post:
      summary: 작가 전문 검색
      description: 이름, 기관, 세그먼트 등을 기반으로 한 전문 검색
      tags:
        - Artists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: 검색어
                filters:
                  type: object
                  properties:
                    segment_id:
                      type: string
                    career_stage:
                      type: string
                    min_score:
                      type: number
                      format: float
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
                  count:
                    type: integer
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/institutions:
    get:
      summary: 모든 기관 조회
      description: 필터를 지원하는 기관 목록 조회
      tags:
        - Institutions
      parameters:
        - name: type
          in: query
          description: 기관 유형 필터
          schema:
            type: string
        - name: city
          in: query
          description: 도시 필터
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  institutions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Institution'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/institutions/{inst_id}:
    get:
      summary: 기관 상세 정보 조회
      description: 기관 상세 정보 및 관련 데이터 조회
      tags:
        - Institutions
      parameters:
        - $ref: '#/components/parameters/inst_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  institution:
                    $ref: '#/components/schemas/Institution'
                  affiliated_artists:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
                  organized_exhibitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exhibition'
                  member_clusters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cluster'
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/institutions/{inst_id}/affiliated-artists:
    get:
      summary: 기관 소속 미술가 목록 조회
      description: 특정 기관에 소속된 미술가 목록 조회
      tags:
        - Institutions
      parameters:
        - $ref: '#/components/parameters/inst_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  affiliated_artists:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/institutions/{inst_id}/exhibitions:
    get:
      summary: 기관 전시 목록 조회
      description: 기관이 개최한 전시 목록 조회
      tags:
        - Institutions
      parameters:
        - $ref: '#/components/parameters/inst_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  exhibitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exhibition'
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/institutions/{inst_id}/benchmarking:
    get:
      summary: 기관 벤치마킹 조회
      description: 동종 기관과의 비교 분석 조회
      tags:
        - Institutions
      parameters:
        - $ref: '#/components/parameters/inst_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    $ref: '#/components/schemas/Institution'
                  peers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Institution'
                  metrics:
                    type: object
                    properties:
                      prestige_rank:
                        type: integer
                      exhibition_frequency:
                        type: integer
                      artist_diversity:
                        type: number
                        format: float
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/exhibitions:
    get:
      summary: 모든 전시 조회
      description: 필터를 지원하는 전시 목록 조회
      tags:
        - Exhibitions
      parameters:
        - name: organizer_id
          in: query
          description: 주최 기관 ID 필터
          schema:
            type: string
        - name: start_year
          in: query
          description: 시작 연도 필터
          schema:
            type: integer
        - name: end_year
          in: query
          description: 종료 연도 필터
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  exhibitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exhibition'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/exhibitions/{exh_id}:
    get:
      summary: 전시 상세 정보 조회
      description: 전시 상세 정보 및 참여 작가, 작품 조회
      tags:
        - Exhibitions
      parameters:
        - $ref: '#/components/parameters/exh_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  exhibition:
                    $ref: '#/components/schemas/Exhibition'
                  participating_artists:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
                  featured_artworks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artwork'
        '404':
          $ref: '#/components/responses/404NotFound'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/transactions:
    get:
      summary: 모든 거래 조회
      description: 필터를 지원하는 거래 목록 조회
      tags:
        - Transactions
      parameters:
        - name: artist_id
          in: query
          description: 작가 ID 필터
          schema:
            type: string
        - name: transaction_type
          in: query
          description: 거래 유형 필터
          schema:
            type: string
        - name: start_date
          in: query
          description: 시작 날짜 필터
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: 종료 날짜 필터
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /v1/api/transactions/{trans_id}:
    get:
      summary: 거래 상세 정보 조회
      description: 특정 거래의 상세 정보 조회
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/trans_id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
